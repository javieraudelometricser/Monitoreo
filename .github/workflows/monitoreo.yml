name: Monitoreo CDMX

on:
  schedule:
       - cron: "40 20 * * *"   # 20:40 UTC = 14:40 CDMX, para que llegue ~15:00
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recolectar Google News
        run: python recolector_gnews.py

      - name: Resumir y enviar a Telegram
        run: python resumen.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
