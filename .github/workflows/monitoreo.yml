name: Monitoreo CDMX

on:
  schedule:
    - cron: "40 20 * * *"   # 20:40 UTC = 14:40 CDMX, para que llegue ~15:00
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # necesario para guardar historial.json en el repo

jobs:
  corte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recolectar Google News
        run: python recolector_gnews.py

      - name: Resumir y enviar a Telegram
        run: python resumen.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar historial
        if: always()        # se guarda aunque Gemini falle: los conteos no dependen de él
        run: |
          if [ -f historial.json ]; then
            git config user.name "monitoreo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historial.json
            git commit -m "Historial $(date +%F)" || echo "Sin cambios en el historial"
            git push
          fi
